
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "Rar-Converter"
          Gichu_RAR_Converter.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rar-Converter-Windows
          path: dist/Rar-Converter.exe
          if-no-files-found: error
          retention-days: 30
